name: PhotoCuller
options:
  bundleIdPrefix: com.byairu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  CullerKit:
    path: Packages/CullerKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  PhotoCuller:
    type: application
    platform: macOS
    sources:
      - path: PhotoCuller
    dependencies:
      - package: CullerKit
    settings:
      base:
        PRODUCT_NAME: PhotoCuller
        PRODUCT_BUNDLE_IDENTIFIER: com.byairu.photoculler
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhotoCuller
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: PhotoCuller/Resources/PhotoCuller.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
schemes:
  PhotoCuller:
    build:
      targets:
        PhotoCuller: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: CullerKit/CullerKitTests
    archive:
      config: Release
